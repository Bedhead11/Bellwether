[project]
name = "bellwether"
version = "0.0.1"
description = "Behavioral drift detection for AI agents — learns a per-agent baseline and flags statistically significant deviations before they surface as failures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "BELLWETHER contributors" }]
keywords = ["llm", "agents", "observability", "drift-detection", "opentelemetry", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]

# Phase 0 keeps the dependency surface intentionally small. Heavier deps
# (river, alibi-detect, langgraph, fastmcp, litellm, ollama) arrive in the
# phase that first needs them — see docs/design and the phased plan in the brief.
dependencies = [
    "pydantic>=2.7",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.100",
]
# Optional zero-code MCP server form factor (brief §5 v2).
mcp = [
    "fastmcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/bedhead11/bellwether"
Repository = "https://github.com/bedhead11/bellwether"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellwether"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
packages = ["bellwether"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# The MCP server wraps FastMCP, an optional, unstubbed dependency; its decorators are untyped.
[[tool.mypy.overrides]]
module = "bellwether.mcp_server"
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = "fastmcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["bellwether"]
branch = true
